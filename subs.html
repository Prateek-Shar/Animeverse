<!DOCTYPE html>
 <html>
 <head>
     <meta name= "viewport" content= "width=device-width, initial-scale=1.0">

     <link rel= "stylesheet" href= "subs.css">
 </head>
 <body >
<div class="container">
    <div class="col-1">
        <img src="logo2.png" class="logo">
        <ul>
            <li><img src="icon.png">Unlimited animes to watch.</li>
            <li><img src="icon.png">Watch anywhere. Cancel anytime.</li>
            <li><img src="icon.png">Unlimited mangas to read.</li>

            <br>
            <p>NAME</p>
            <input type="text" placeholder="Enter Your Name">

            <button type="submit">Subscribe</button>
        </form>
        
    </div>
</div>

 </html>
