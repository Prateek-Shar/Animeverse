<!DOCTYPE html>
 <html>
 <head>
     <meta name= "viewport" content= "width=device-width, initial-scale=1.0">

     <link rel= "stylesheet" href= "contactus.css">
 </head>
 <body >
    <section class="contact">
        <div class="content">
            <h2>Contact Us</h2>
            <p>We would love to respond to your queries and help you.
                Feel free to get in touch with us.
            </p>
        </div>
        <div class="container">
                <div class="contactinfo">
                    <div class="box">
                        <div class="icon">
                            
                        
                            <div class="text">
                                <h3>Address</h3>
                                <p>4671 Sugar Camp Road,<br>Owatonna,Minnesota,<br>55060</p>
                            </div>
                        </div>
                    </div>
                        <div class="box">
                            <div class="icon">
                                
                            
                                <div class="text">
                                    <h3>Phone</h3>
                                    <p>507-475-6094</p>
                                </div>
                            </div>
                        </div>
                            <div class="box">
                                <div class="icon">
                                    
                                
                                    <div class="text">
                                        <h3>Email</h3>
                                        <p>prateek12153@gmail.com</p>
                                    </div>
                                </div>
                            </div>                      
                    </div>

                    <div class="contactform">
                        <form>
                            <h2>Send Message</h2>
                            <div class="inputbox">
                                <input type="text" name="" required="required">
                                <span>Full Name</span>
                            </div> 
                            <div class="inputbox">
                                <input type="text" name="" required="required">
                                <span>Email</span>
                            </div> 
                            <div class="inputbox">
                                <textarea required="required"></textarea>
                                <span>Type Your Message...</span>
                            </div> 
                            <div class="inputbox">
                                <input type="submit" name="" value="send">
                            </div> 
                        </form>
                    </div>
        </div>
            

    </section>
 </body>
